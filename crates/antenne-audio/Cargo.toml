[package]
name = "antenne-audio"
description = "Capture audio multiplateforme (cpal) et gestion des cartes son virtuelles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
antenne-core.workspace = true
anyhow.workspace = true
cpal.workspace = true
rtrb.workspace = true
tracing.workspace = true

# Linux : hôte PipeWire natif de cpal (les null sinks y apparaissent comme
# entrées capturables). Nécessite libpipewire-0.3-dev + clang à la compilation.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire"] }

[lints]
workspace = true
