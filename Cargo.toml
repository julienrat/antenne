[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/antenne"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
# Licence : à définir (projet In Corpo).

[workspace.dependencies]
# Crates internes
antenne-core = { path = "crates/antenne-core" }
antenne-audio = { path = "crates/antenne-audio" }
antenne-codec = { path = "crates/antenne-codec" }
antenne-net = { path = "crates/antenne-net" }

# Généraliste
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async / réseau
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.8"
# WebRTC « sans-IO ». Crypto 100 % Rust : ni cmake ni NASM sur les trois OS.
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
bytes = "1"
futures-util = "0.3"

# Audio
cpal = "0.18"
rtrb = "0.3"
opus = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimise les dépendances même en debug : l'audio temps réel en debug pur
# peut provoquer des décrochages (xruns).
[profile.dev.package."*"]
opt-level = 2
